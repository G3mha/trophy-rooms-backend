name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs when a branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 20 matches the Dockerfile and package.json engines.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # The postinstall hook runs `prisma generate`, and so does `npm run
      # build` - skip it here, the same way the Dockerfile does.
      - name: Install dependencies
        run: npm ci
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: "1"

      - name: Lint
        run: npm run lint

      # `prisma generate` reads the schema only, so no DATABASE_URL is needed.
      - name: Build
        run: npm run build

      # The build rewrites tracked generated sources (src/generated/pothos-types.ts).
      # A dirty tree here means the committed copy is stale - typically a Prisma
      # schema change that was not regenerated.
      - name: Check generated files are up to date
        run: |
          if ! git diff --quiet; then
            echo "::error::Build changed tracked files. Run 'npm run build' and commit the result."
            git diff --stat
            git diff
            exit 1
          fi

  # Trophy awarding, game progress and the duplicate-trophy cleanup, end to end
  # through the GraphQL schema. The script only runs against an empty database
  # on localhost, which the service container gives it.
  verify-trophies:
    name: Verify trophies and progress
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trophy_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trophy_verify
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/trophy_verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: "1"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create the schema
        run: npx prisma db push --skip-generate

      - name: Run verify-trophy-progress
        run: npx tsx scripts/verify-trophy-progress.ts
