name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs when a branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 20 matches the Dockerfile and package.json engines.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # The postinstall hook runs `prisma generate`, and so does `npm run
      # build` - skip it here, the same way the Dockerfile does.
      - name: Install dependencies
        run: npm ci
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: "1"

      - name: Lint
        run: npm run lint

      # `prisma generate` reads the schema only, so no DATABASE_URL is needed.
      - name: Build
        run: npm run build
